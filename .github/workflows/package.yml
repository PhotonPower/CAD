name: Packages

# Installers / packages (packaging/README.md): Windows (Inno Setup), AlmaLinux / RHEL 10 (RPM),
# macOS (DMG, unsigned). Built for tags, on demand, and for pull requests that touch packaging.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "packaging/**"
      - "resources/linux/**"
      - "CMakeLists.txt"
      - ".github/workflows/package.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  NURBFORGE_TAG: a35e92994ed55d5dbaba4e72f30bbdd106584d1c

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.*"
          arch: win64_msvc2022_64
          modules: qtshadertools
          cache: true
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DNFCAD_BUILD_TESTS=OFF "-DNFCAD_NURBFORGE_TAG=${{ env.NURBFORGE_TAG }}"
          cmake --build build
      - name: Stage (windeployqt)
        # Qt 6.8's deploy support needs an absolute prefix
        run: cmake --install build --component app --prefix "$PWD\stage"
      - name: Check the staged files
        shell: bash
        run: |
          test -f stage/bin/RaytatouilleFusion.exe
          ls stage/bin | grep -i Qt6Core
          find stage -iname 'qwindows.dll' | grep -q .
          test -f stage/LICENSE.txt
      - name: Installer (Inno Setup)
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DSourceDir=$PWD\stage" "/DOutputDir=$PWD\dist" packaging\windows\raytatouille-fusion.iss
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/*.exe

  almalinux10:
    name: AlmaLinux / RHEL 10 RPM
    runs-on: ubuntu-latest
    container: almalinux:10
    steps:
      - name: Build dependencies
        run: |
          dnf install -y epel-release dnf-plugins-core
          dnf config-manager --set-enabled crb
          dnf install -y rpm-build gcc-c++ git cmake ninja-build \
                         qt6-qtbase-devel qt6-qtbase-private-devel qt6-qtsvg-devel \
                         qt6-qtshadertools-devel mesa-libGL-devel
      - uses: actions/checkout@v5
      - name: rpmbuild
        run: |
          rpmbuild -bb packaging/linux/raytatouille-fusion.spec \
            --define "_srcdir $PWD" --define "_topdir $PWD/rpmbuild" \
            --define "nurbforge_tag $NURBFORGE_TAG"
      - name: Install and smoke test
        run: |
          dnf install -y ./rpmbuild/RPMS/*/raytatouille-fusion-*.rpm
          rpm -ql raytatouille-fusion
          QT_QPA_PLATFORM=offscreen RaytatouilleFusion --version
      - uses: actions/upload-artifact@v4
        with:
          name: almalinux10-rpm
          path: rpmbuild/RPMS/*/*.rpm

  macos:
    name: macOS disk image (universal)
    runs-on: macos-latest
    env:
      MACOSX_DEPLOYMENT_TARGET: "14.0"
    steps:
      - uses: actions/checkout@v5
      # Qt from qt.io: universal (arm64 + x86_64) binaries; Homebrew's Qt is arm64 only. Qt 6.8's
      # CMake files still link the AGL framework, which current macOS SDKs no longer have.
      - uses: jurplel/install-qt-action@v4
        with:
          version: "6.10.*"
          host: mac
          target: desktop
          arch: clang_64
          modules: qtshadertools
          cache: true
      - name: Tools
        run: brew install ninja
      - name: Build and stage (macdeployqt)
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DNFCAD_BUILD_TESTS=OFF \
                -DNFCAD_NURBFORGE_TAG=$NURBFORGE_TAG "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"
          cmake --build build
          cmake --install build --component app --prefix "$PWD/stage"
      - name: Check the bundle (both architectures, no foreign library paths)
        run: |
          app=stage/RaytatouilleFusion.app
          lipo -archs $app/Contents/MacOS/RaytatouilleFusion | tee /dev/stderr | grep -q "x86_64 arm64\|arm64 x86_64"
          lipo -archs $app/Contents/Frameworks/QtCore.framework/Versions/A/QtCore | grep -q x86_64
          ! otool -L $app/Contents/MacOS/RaytatouilleFusion | grep -E "/opt/homebrew|/usr/local"
          $app/Contents/MacOS/RaytatouilleFusion --version
      - name: Disk image
        run: packaging/macos/make_dmg.sh stage/RaytatouilleFusion.app RaytatouilleFusion-macos.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: RaytatouilleFusion-macos.dmg

  # For a tag v*: a draft GitHub release with the three packages; the owner publishes it.
  release:
    name: Draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, almalinux10, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '$0 ~ "^## \\[" v "\\]" {on=1; next} on && /^## \[/ {exit} on' CHANGELOG.md > notes.md
          test -s notes.md || echo "Raytatouille Fusion $version" > notes.md
          mkdir upload
          cp dist/windows-installer/*.exe upload/
          cp dist/almalinux10-rpm/*.rpm upload/
          cp dist/macos-dmg/RaytatouilleFusion-macos.dmg "upload/RaytatouilleFusion-$version-macos-universal.dmg"
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" upload/* --draft --verify-tag \
            --title "Raytatouille Fusion ${GITHUB_REF_NAME#v}" --notes-file notes.md
