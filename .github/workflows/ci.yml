name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Nurbforge is downloaded at this tag or commit (cmake/FindOrFetchNurbforge.cmake).
  # a35e929 = Nurbforge branch feature/macos (macOS < 26 support for the STEP reader);
  # switch back to a release tag once that is released.
  NURBFORGE_TAG: a35e92994ed55d5dbaba4e72f30bbdd106584d1c

jobs:
  macos:
    name: macOS (Apple Clang, Qt 6, arm64)
    runs-on: macos-latest
    env:
      MACOSX_DEPLOYMENT_TARGET: "14.0"
    steps:
      - uses: actions/checkout@v5
      - name: Tools
        run: brew install qt ninja
      - name: Configure & build
        run: |
          cmake --preset ci -DNFCAD_NURBFORGE_TAG=$NURBFORGE_TAG
          cmake --build --preset ci -j
      - name: Tests
        run: ctest --preset ci --output-on-failure

  almalinux10:
    name: AlmaLinux 10 (GCC, distro Qt 6)
    runs-on: ubuntu-latest
    container: almalinux:10
    steps:
      - name: System packages
        run: |
          dnf install -y epel-release dnf-plugins-core
          dnf config-manager --set-enabled crb
          dnf install -y gcc-c++ git cmake ninja-build python3 \
                         qt6-qtbase-devel qt6-qtbase-private-devel qt6-qtsvg-devel \
                         qt6-qtshadertools-devel \
                         mesa-libGL-devel
          rpm -q qt6-qtbase
      - uses: actions/checkout@v5
      - name: Configure & build
        run: |
          cmake --preset ci -DNFCAD_NURBFORGE_TAG=$NURBFORGE_TAG
          cmake --build --preset ci -j
      - name: Tests
        run: ctest --preset ci --output-on-failure

  windows11:
    name: Windows (MSVC, Qt 6)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.*"
          arch: win64_msvc2022_64
          modules: qtshadertools
          cache: true
      - name: Configure & build
        run: |
          cmake --preset msvc "-DNFCAD_NURBFORGE_TAG=${{ env.NURBFORGE_TAG }}"
          cmake --build --preset msvc
      - name: Tests
        run: ctest --preset msvc --output-on-failure
      - name: Failing tests run directly (diagnostics on failure)
        if: failure()
        run: |
          $failed = Get-Content build\msvc\Testing\Temporary\LastTestsFailed.log -ErrorAction SilentlyContinue |
                    ForEach-Object { ($_ -split ':', 2)[1] }
          foreach ($name in $failed) {
            $exe = Get-ChildItem -Recurse build\msvc -Filter "$name.exe" | Select-Object -First 1
            if ($exe) {
              Write-Host "== $($exe.FullName)"
              & $exe.FullName -o "$env:RUNNER_TEMP\$name.txt,txt"
              Write-Host ("exit code: 0x{0:X8}" -f $LASTEXITCODE)
              Get-Content "$env:RUNNER_TEMP\$name.txt" -ErrorAction SilentlyContinue | Out-Host
            }
          }

  lint:
    name: clang-format (report only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: |
          find src tests -name '*.cpp' -o -name '*.hpp' | xargs clang-format --dry-run || true
